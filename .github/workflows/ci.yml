name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # The suite must never reach a hosted database by accident.
      HANDOVER_ALLOW_EMBEDDED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

  browser:
    name: browser journey
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the app
        env:
          HANDOVER_ALLOW_EMBEDDED: "1"
        run: |
          npx next build
          nohup npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health

      - name: Playwright journey
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Server log
        if: always()
        run: cat server.log

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on obvious secret shapes
        run: |
          set -euo pipefail
          if git grep -nEI 'postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@' -- . ':!*.md'; then
            echo "A Postgres URL with an inline password is committed."; exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})' -- .; then
            echo "A token-shaped string is committed."; exit 1
          fi
          echo "no committed secrets found"